name: Deploy Frontend to Azure App Service

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'backend-ts/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: AIzaSyANThwic7Udj0r5ulBoPN9Dp2lSwJKOAK4
          NEXT_PUBLIC_BACKEND_URL: https://propertyval-api.azurewebsites.net
          NEXT_PUBLIC_AZURE_AD_CLIENT_ID: d26ae572-f93f-4cb5-b53c-5825eb8a596e
          NEXT_PUBLIC_AZURE_AD_TENANT_ID: 9951d859-c4eb-4983-8987-062d0b8a8b39
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: 547867734324-dnin22seejnnqnkkaefonp74fdl2j70k.apps.googleusercontent.com

      - name: Prepare deployment package
        run: |
          mkdir -p deploy
          cp -r .next/standalone/. deploy/
          mkdir -p deploy/.next
          cp -r .next/static deploy/.next/static
          cp -r public deploy/public

      - name: Create deployment zip
        run: |
          cd deploy
          zip -r ../deploy.zip .

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        run: |
          az webapp deploy \
            --resource-group propertyval-rg \
            --name propertyval-web \
            --src-path deploy.zip \
            --type zip
